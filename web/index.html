<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101923" />
    <meta name="description" content="Interactive lab to explore the mathematical generation of dungeons." />
    <title>Dungeon generator · Interactive lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101923;
        --panel: #141f2b;
        --panel-raised: #1b2938;
        --panel-hover: #223449;
        --line: #2b3b4d;
        --text: #e8eef6;
        --muted: #9eafc2;
        --quiet: #70849a;
        --accent: #79c8ff;
        --accent-strong: #3d9de3;
        --positive: #73d7a6;
        --negative: #ff8787;
        --shadow: 0 12px 32px rgba(0, 0, 0, .34);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { overflow: hidden; }
      button, input, select { color: inherit; font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }

      #app { display: grid; grid-template-columns: minmax(285px, 320px) minmax(380px, 1fr) minmax(280px, 320px); height: 100dvh; min-height: 0; }
      #app > section { min-width: 0; min-height: 0; }
      .panel { overflow: auto; padding: 22px 18px 28px; scrollbar-color: #41566d transparent; scrollbar-width: thin; }
      #controls { background: var(--panel); border-right: 1px solid var(--line); }
      #results { background: #121c27; border-left: 1px solid var(--line); }
      #view { position: relative; overflow: hidden; min-width: 0; background: radial-gradient(ellipse at center, #182434 0%, #0d141d 78%); }
      #dungeon-map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      #dungeon-map.dragging { cursor: grabbing; }

      .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid #356389; border-radius: 12px; background: linear-gradient(145deg, #254765, #1a2d41); color: #b4e3ff; font-size: 22px; font-weight: 700; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -.025em; }
      h2 { margin: 0; font-size: 15px; line-height: 1.3; }
      h3 { margin: 0; font-size: 13px; }
      .eyebrow { margin: 0 0 3px; color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .11em; }
      .intro-copy { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
      .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 9px; }
      .section-title h2 { color: #dce8f5; }
      .level-section { border-top: 1px solid var(--line); padding-top: 1px; }
      .level-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
      .level-button { min-height: 35px; padding: 5px 3px; border: 1px solid var(--line); border-radius: 8px; background: #192635; color: var(--muted); font-size: 11px; font-weight: 650; }
      .level-button:hover { border-color: #5889b4; background: #20364b; color: var(--text); }
      .level-button.selected { border-color: #58a9e4; background: #254c6c; color: #e9f6ff; box-shadow: inset 0 0 0 1px rgba(121, 200, 255, .18); }
      .level-description { min-height: 34px; margin: 8px 0 0; color: var(--muted); font-size: 11px; }

      .seed-card { margin: 12px 0 10px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: #172330; }
      .seed-card > label { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; color: #dbe8f5; font-size: 12px; font-weight: 650; }
      .seed-control { display: grid; grid-template-columns: minmax(82px, 1fr) 34px 34px auto; gap: 5px; }
      .seed-control input, .field input, .field select { width: 100%; min-width: 0; height: 34px; padding: 5px 8px; border: 1px solid #3a4f64; border-radius: 7px; background: #0f1924; }
      input[aria-invalid="true"] { border-color: var(--negative); }
      .icon-button, .secondary-button, .map-tool-button { border: 1px solid #3a536b; border-radius: 7px; background: #203247; color: #dceeff; }
      .icon-button { min-width: 34px; padding: 3px; font-size: 18px; line-height: 1; }
      .secondary-button { min-height: 34px; padding: 6px 9px; font-size: 11px; font-weight: 650; }
      .icon-button:hover, .secondary-button:hover, .map-tool-button:hover { border-color: #74b7e9; background: #2b4965; }
      .keyboard-hint { margin: 8px 0 0; color: var(--quiet); font-size: 10px; }
      .action-row { display: grid; grid-template-columns: 1fr; gap: 6px; }
      .changed-row { display: flex; justify-content: flex-end; margin: 7px 1px; }
      .changed-status { color: var(--quiet); font-size: 10px; }
      .changed-status.changed { color: #f4c978; }
      .changed-status[data-pending="true"]::after { content: " · atualizando"; color: var(--accent); }
      .howto { margin: 12px 0 16px; padding: 9px 10px; border: 1px solid #314861; border-radius: 8px; background: #172838; }
      .howto summary, .parameter-group summary, .tool-group summary, .result-group summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; }
      .howto summary::-webkit-details-marker, .parameter-group summary::-webkit-details-marker, .tool-group summary::-webkit-details-marker, .result-group summary::-webkit-details-marker { display: none; }
      .howto summary::after, .parameter-group summary::after, .tool-group summary::after, .result-group summary::after { content: "＋"; color: var(--accent); font-size: 14px; }
      .howto[open] summary::after, .parameter-group[open] summary::after, .tool-group[open] summary::after, .result-group[open] summary::after { content: "−"; }
      .howto summary { color: #d8eaff; font-size: 11px; font-weight: 650; }
      .howto p { margin: 8px 0 0; color: var(--muted); font-size: 11px; }

      .overlay-title { margin-top: 17px; }
      .overlay-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .overlay-option { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 10px; }
      .overlay-option input { accent-color: #64b8f0; }
      .overlay-option span { min-width: 0; }
      .experiments { margin-top: 11px; }
      .experiment-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 10px 10px; }
      .experiment-button { display: grid; gap: 3px; min-height: 62px; padding: 8px; border: 1px solid #344d64; border-radius: 8px; background: #1a2b3b; text-align: left; }
      .experiment-button:hover { border-color: #69a8d6; background: #203950; }
      .experiment-button strong { color: #d8ebfb; font-size: 10px; }
      .experiment-button span { color: var(--muted); font-size: 9px; line-height: 1.35; }
      .parameter-title { margin-top: 21px; padding-top: 13px; border-top: 1px solid var(--line); }
      .parameter-groups { display: grid; gap: 7px; }
      .parameter-group, .tool-group { overflow: visible; border: 1px solid #2b3d50; border-radius: 9px; background: #172330; }
      .parameter-group summary, .tool-group summary { min-height: 39px; padding: 8px 10px; color: #d9e8f7; font-size: 11px; font-weight: 700; }
      .group-count { display: inline-grid; place-items: center; min-width: 21px; height: 20px; margin-left: auto; border-radius: 10px; background: #263b50; color: #9bb8d2; font-size: 10px; }
      .group-intro { margin: 0 10px 8px; color: var(--muted); font-size: 10px; }
      .group-reset { margin: 0 10px 8px; }
      .text-button { padding: 3px 0; border: 0; background: transparent; color: var(--accent); font-size: 10px; text-align: left; }
      .text-button:hover { text-decoration: underline; }
      .field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 125px); gap: 6px 10px; align-items: center; padding: 5px 10px; border-top: 1px solid rgba(43, 61, 80, .55); }
      .field-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .field-title label { overflow: hidden; color: #c5d3e1; font-size: 10px; text-overflow: ellipsis; }
      .field input, .field select { height: 31px; font-size: 11px; }
      .field input[type="checkbox"] { justify-self: end; width: 18px; height: 18px; accent-color: #64b8f0; }
      .field-error { grid-column: 1 / -1; margin-top: -4px; color: var(--negative); font-size: 10px; }
      .readonly-setting { display: flex; align-items: center; gap: 8px; margin: 0 10px 10px; padding: 8px; border-radius: 7px; background: #111b26; color: var(--muted); font-size: 11px; }
      .readonly-setting strong { margin-left: auto; color: #e8eef6; }
      .tool-group { margin-top: 12px; }
      .tool-buttons { display: grid; gap: 6px; margin: 0 10px 8px; }
      .status-line { margin: 0 10px 10px; color: var(--muted); font-size: 10px; }

      .help-button { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; flex: 0 0 auto; padding: 0; border: 1px solid #54718c; border-radius: 50%; background: #1d3144; color: #b8dfff; font-size: 10px; font-weight: 750; line-height: 1; }
      .help-button:hover, .help-button[aria-expanded="true"] { border-color: var(--accent); background: #2a4b67; }
      .help-tooltip { position: fixed; z-index: 1000; max-width: calc(100vw - 24px); padding: 10px 12px; border: 1px solid #5980a1; border-radius: 8px; background: #0b1520; box-shadow: var(--shadow); color: #e6f1fc; font-size: 12px; line-height: 1.45; pointer-events: none; }

      .panel-header { margin: 3px 0 14px; }
      .panel-header h2 { font-size: 18px; letter-spacing: -.02em; }
      .validity-card { display: flex; gap: 10px; margin: 0 0 14px; padding: 11px; border: 1px solid; border-radius: 10px; }
      .validity-card.valid { border-color: #316d54; background: rgba(40, 100, 73, .19); }
      .validity-card.invalid { border-color: #874f4f; background: rgba(120, 44, 44, .19); }
      .status-icon { display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto; border-radius: 50%; background: rgba(115, 215, 166, .16); color: var(--positive); font-weight: 800; }
      .invalid .status-icon { background: rgba(255, 135, 135, .16); color: var(--negative); }
      .validity-card strong { display: block; color: var(--positive); font-size: 12px; }
      .validity-card.invalid strong { color: var(--negative); }
      .validity-card p { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
      .validity-card ul { max-height: 170px; overflow: auto; margin: 7px 0 0; padding-left: 17px; color: #ffc7c7; font-size: 10px; }
      .result-group { margin: 7px 0; border: 1px solid #283a4c; border-radius: 9px; background: #16222e; }
      .result-group summary { min-height: 38px; padding: 8px 10px; color: #dce8f5; font-size: 11px; font-weight: 700; }
      .metric-table { width: 100%; border-collapse: collapse; }
      .metric-table th, .metric-table td { padding: 7px 9px; border-top: 1px solid rgba(43, 61, 80, .65); font-size: 10px; }
      .metric-table th { width: 72%; color: var(--muted); font-weight: 500; text-align: left; }
      .metric-table td { color: #f0f5fb; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
      .metric-table th .help-button { margin-left: 5px; vertical-align: middle; }
      .result-section { margin: 13px 0; }
      .result-section h3 { margin-bottom: 8px; color: #dce8f5; }
      .chip-list, .legend-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .shape-chip, .legend-item { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid #2b3d50; border-radius: 14px; background: #172431; color: var(--muted); font-size: 10px; }
      .shape-chip i, .legend-item i { width: 9px; height: 9px; border-radius: 3px; }
      .legend-block { padding: 1px 10px 10px; }
      .legend-block > strong { display: block; margin: 6px 0; color: #c7d7e6; font-size: 10px; }
      .legend-block p { margin: 8px 0 0; font-size: 10px; }
      .log-list { max-height: 200px; overflow: auto; margin: 0; padding: 0 10px 10px 26px; color: var(--muted); font-size: 10px; }
      .muted { color: var(--muted); }

      .map-toolbar { position: absolute; z-index: 3; top: 14px; left: 50%; display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid rgba(105, 133, 161, .5); border-radius: 10px; background: rgba(12, 21, 31, .9); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transform: translateX(-50%); backdrop-filter: blur(8px); }
      .map-tool-button { min-width: 31px; height: 30px; padding: 4px 8px; font-size: 15px; }
      .map-tool-button.fit-button { padding: 4px 10px; font-size: 10px; font-weight: 650; }
      .zoom-label { min-width: 42px; color: #c9d8e8; font-size: 10px; font-variant-numeric: tabular-nums; text-align: center; }
      .map-instructions { position: absolute; right: 12px; bottom: 11px; left: 12px; color: #94a8bd; font-size: 10px; text-align: center; text-shadow: 0 1px 4px #080d14; pointer-events: none; }
      .map-tooltip { position: absolute; z-index: 4; width: max-content; max-width: min(280px, calc(100% - 20px)); padding: 9px 11px; border: 1px solid #6685a3; border-radius: 8px; background: rgba(9, 16, 24, .96); box-shadow: var(--shadow); color: #e9f1fa; font-size: 11px; line-height: 1.5; white-space: pre-line; pointer-events: none; }
      .toast { position: fixed; z-index: 1100; right: 20px; bottom: 20px; max-width: min(380px, calc(100vw - 40px)); padding: 10px 14px; border: 1px solid #5980a1; border-radius: 9px; background: #132536; box-shadow: var(--shadow); color: #e7f3ff; font-size: 12px; }

      @media (max-width: 1240px) {
        body { overflow: auto; }
        #app { height: auto; min-height: 100dvh; grid-template-columns: minmax(285px, 340px) minmax(0, 1fr); grid-template-rows: minmax(64vh, 1fr) auto; }
        #controls { grid-column: 1; grid-row: 1; max-height: 100dvh; }
        #view { grid-column: 2; grid-row: 1; min-height: 64vh; }
        #results { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 0 14px; max-height: none; border-top: 1px solid var(--line); border-left: 0; }
        #results > .panel-header, #results > .validity-card { grid-column: 1 / -1; }
        #results > .result-section, #results > .result-group { min-width: 0; }
      }
      @media (max-width: 760px) {
        body { overflow: auto; }
        #app { display: flex; flex-direction: column; min-height: 100dvh; }
        #view { order: 0; height: 54dvh; min-height: 360px; max-height: 620px; }
        #controls { order: 1; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
        #results { order: 2; display: block; max-height: none; }
        .panel { padding: 18px 15px 24px; }
        .map-instructions { font-size: 9px; }
        .map-toolbar { top: 9px; }
        .overlay-list { grid-template-columns: 1fr 1fr; }
      }
      @media (prefers-reduced-motion: no-preference) {
        button, input, select, .validity-card { transition: border-color .14s ease, background-color .14s ease, box-shadow .14s ease; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Dungeon generator lab">
      <div class="loading-state">Loading the generator…</div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
