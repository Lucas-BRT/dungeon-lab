<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon lab (Rust + WASM)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101820; color: #dde; font: 14px monospace; }
      #app { display: grid; grid-template-columns: 360px minmax(0, 1fr) 340px; height: 100%; }
      #app > section { overflow: auto; padding: 8px; min-width: 0; }
      #app > section + section { border-left: 1px solid #234; }
      canvas { width: 100%; height: 100%; display: block; background: #0a0e14; cursor: grab; touch-action: none; }
      #view { padding: 0 !important; position: relative; }
      button, input, select { font: inherit; background: #1c2633; color: #dde; border: 1px solid #345; padding: 2px 6px; }
      button.on { background: #2f6aa0; }
      h3 { margin: 12px 0 4px; color: #9cf; font-size: 14px; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
      .field { display: grid; grid-template-columns: 1fr 110px; gap: 6px; align-items: center; margin: 2px 0; }
      .field span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .field input, .field select { width: 100%; box-sizing: border-box; }
      details summary { cursor: pointer; color: #9cf; margin: 8px 0 2px; }
      table { border-collapse: collapse; width: 100%; }
      td { padding: 2px 4px; border-bottom: 1px solid #1e2a38; }
      td:last-child { text-align: right; }
      .ok { color: #7d7; } .bad { color: #f77; } .dim { color: #789; }
      .legend span { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: middle; }
      ul { margin: 4px 0; padding-left: 18px; }
      @media (max-width: 1000px) { #app { grid-template-columns: 1fr; height: auto; } #view { height: 70vh; } }
    </style>
  </head>
  <body>
    <div id="app">Loading the module…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
