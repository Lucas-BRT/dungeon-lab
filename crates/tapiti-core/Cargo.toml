[package]
name = "tapiti-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Level generation, validation, and graph metrics"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
diagnostic-profile = []

[dependencies]
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1"

[[bench]]
name = "generator"
harness = false
