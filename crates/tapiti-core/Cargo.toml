[package]
name = "tapiti-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dungeon level generation, validation, and graph metrics"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
diagnostic-profile = []
frontier-growth = []

[dependencies]
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[dev-dependencies]
criterion = "0.8.2"
pollster = "0.4"
serde_json = "1"
wgpu = "28"

[[bench]]
name = "generator"
harness = false
