[package]
name = "tapiti-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings and JSON API for Tapiti"

[lib]
name = "tapiti"
crate-type = ["cdylib", "rlib"]

[dependencies]
tapiti-core = { path = "../tapiti-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
