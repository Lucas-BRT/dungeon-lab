name: Release

# Pushing a tag such as v0.1.0 builds and checks the packages (packages.yml) and publishes one release with:
#   tapiti-x86_64-unknown-linux-gnu.tar.gz    what install.sh unpacks (the name has no version, so /releases/latest/download works)
#   tapiti_<version>-1_amd64.deb, tapiti-<version>-1.x86_64.rpm
#   tapiti-x86_64-pc-windows-msvc.zip and .exe
#   tapiti-aarch64-apple-darwin.tar.gz        Tapiti.app, with its icon
#   SHA256SUMS, and the signed build provenance of all of them (`gh attestation verify FILE --repo Lucas-BRT/tapiti`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  publish:
    needs: packages
    runs-on: ubuntu-latest
    # id-token and attestations: the signed build provenance of the assets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tapiti ${GITHUB_REF_NAME#v}" \
            --generate-notes
