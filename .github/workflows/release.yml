name: Release

# Pushing a tag such as v0.1.0 builds the desktop app for each platform and publishes one release with:
#   tapiti-x86_64-unknown-linux-gnu.tar.gz    what install.sh unpacks (the name has no version, so /releases/latest/download works)
#   tapiti_<version>-1_amd64.deb, tapiti-<version>-1.x86_64.rpm
#   tapiti-x86_64-pc-windows-msvc.zip and .exe
#   tapiti-aarch64-apple-darwin.tar.gz
#   SHA256SUMS, and the signed build provenance of all of them (`gh attestation verify FILE --repo Lucas-BRT/tapiti`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (tar.gz, deb, rpm)
    # The oldest supported Ubuntu, so the binary runs on 22.04 and newer (install.sh checks for glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Packaging tools
        run: cargo install cargo-deb --version 3.8.0 --locked && cargo install cargo-generate-rpm --version 0.21.1 --locked
      - run: cargo build --release --locked -p tapiti-desktop
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
      - name: Package
        run: |
          mkdir dist
          scripts/package-linux.sh dist
          cargo deb -p tapiti-desktop --no-build --output dist/
          cargo generate-rpm -p apps/desktop --output dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows (zip, exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - run: cargo build --release --locked -p tapiti-desktop --target x86_64-pc-windows-msvc
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
      - name: Package
        shell: bash
        run: |
          name=tapiti-x86_64-pc-windows-msvc
          mkdir -p dist "$name"
          cp target/x86_64-pc-windows-msvc/release/tapiti-desktop.exe "dist/$name.exe"
          cp "dist/$name.exe" "$name/tapiti.exe"
          cp LICENSE README.md "$name/"
          7z a "dist/$name.zip" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS (tar.gz)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - run: cargo build --release --locked -p tapiti-desktop --target aarch64-apple-darwin
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
      - name: Package
        run: |
          name=tapiti-aarch64-apple-darwin
          mkdir -p dist "$name"
          cp target/aarch64-apple-darwin/release/tapiti-desktop "$name/tapiti"
          cp LICENSE README.md "$name/"
          tar czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    # id-token and attestations: the signed build provenance of the assets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tapiti ${GITHUB_REF_NAME#v}" \
            --generate-notes
