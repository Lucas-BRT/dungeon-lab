version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # Pinned on purpose: the lab's glue and the CLI must match this exact version, and Topcoat breaks between releases.
      - dependency-name: wasm-bindgen
      - dependency-name: topcoat
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
