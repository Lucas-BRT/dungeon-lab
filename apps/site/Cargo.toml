[package]
name = "tapiti-site"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "The Tapiti website: landing page, documentation and the browser lab (Topcoat)"

[dependencies]
tapiti-core = { path = "../../crates/tapiti-core" }
tapiti-render = { path = "../../crates/tapiti-render" }
tapiti-schema = { path = "../../crates/tapiti-schema" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Topcoat is experimental and breaks between releases: keep this version exact.
topcoat = { version = "=0.12.0", features = ["l10n-fluent", "fs", "font-fontsource", "sitemap"] }

[lints.rust]
unsafe_code = "forbid"
