[workspace]
members = [
    "apps/desktop",
    "apps/site",
    "crates/tapiti-core",
    "crates/tapiti-render",
    "crates/tapiti-schema",
    "crates/tapiti-wasm",
]
default-members = ["apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lucas-BRT/tapiti"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

# UI crates stay incremental and quick to rebuild. The generator is compiled at
# full speed even in `cargo run`, because it is the hot path users exercise.
[profile.dev]
debug = 0
incremental = true

# Dependencies (egui, the tessellator) at opt-level 2: unoptimised, drawing the map costs tens of milliseconds a frame.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tapiti-core]
opt-level = 3
