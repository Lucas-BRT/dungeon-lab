[package]
name = "dungeon-lab"
version = "0.1.0"
edition = "2021"
default-run = "serve"
description = "Dungeon model generator (rooms of many shapes, octilinear corridors, validator, graph measures) in Rust, compiled to WebAssembly"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["server"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Rayon over the thread pool: native by default. The WebAssembly module is built without it (`--no-default-features`, see README).
default = ["parallel", "server"]
parallel = ["dep:rayon"]
# The dev server of the page (`cargo run`). The WebAssembly build leaves it out with `--no-default-features`.
server = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
rayon = { version = "1", optional = true }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", optional = true, features = ["fs", "set-header"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
