[workspace]
members = [
    "apps/cosmic",
    "apps/web-server",
    "crates/dungeon-core",
    "crates/dungeon-wasm",
]
default-members = ["apps/cosmic"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# libcosmic currently names this package while the upstream repository's latest
# main branch renamed it to `cosmic-settings-daemon-zbus`; use its last compatible revision.
[patch."https://github.com/pop-os/dbus-settings-bindings"]
cosmic-settings-daemon = { git = "https://github.com/pop-os/dbus-settings-bindings//", rev = "85502fb865695a15261a80dea0eef38a8c23e349" }
switcheroo-control = { git = "https://github.com/pop-os/dbus-settings-bindings//", rev = "85502fb865695a15261a80dea0eef38a8c23e349" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

# UI crates stay incremental and quick to rebuild. The generator is compiled at
# full speed even in `cargo run`, because it is the hot path users exercise.
[profile.dev]
debug = 0
incremental = true

# Dependencies (iced, wgpu, the tessellator) at opt-level 2: unoptimised, drawing the map costs tens of milliseconds a frame.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.dungeon-lab-core]
opt-level = 3
